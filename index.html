<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special for You ❤️</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            text-align: center;
        }

        .card {
            background: rgba(255, 255, 255, 0.85);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            max-width: 320px;
            width: 85%;
            z-index: 10;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: #ff4757;
            font-size: 24px;
            margin-bottom: 15px;
        }

        .gif-container img {
            width: 100%;
            max-height: 200px;
            object-fit: cover;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        p {
            color: #555;
            font-size: 15px;
            margin-top: 15px;
            line-height: 1.5;
        }

        .btn {
            background-color: #ff4757;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 15px;
            box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
            transition: 0.2s;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Animasi Love Berjatuhan */
        .heart {
            position: absolute;
            top: -10px;
            color: #ff4757;
            font-size: 20px;
            user-select: none;
            z-index: 1;
            animation: fall linear forwards;
        }

        @keyframes fall {
            to {
                transform: translateY(105vh) rotate(360deg);
            }
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Hai Sayang! ❤️</h1>
        <div class="gif-container">
            <img src="pacar.gif" alt="Cute GIF">
        </div>
        <p id="message">Makasih ya udah jadi bagian paling indah di hidup aku. Tetap sama aku terus ya! ✨</p>
        <button class="btn" onclick="showAlert()">Klik Ini Dong 💌</button>
    </div>

    <script>
        // Fungsi interaktif tombol
        function showAlert() {
            alert("I Love You So Much! ❤️ Jangan lupa senyum hari ini ya cantik/gantengku!");
        }

        // Efek membuat love berjatuhan otomatis
        function createHeart() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = '❤️';
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.opacity = Math.random();
            heart.style.fontSize = (Math.random() * 15 + 10) + 'px';
            
            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 5000);
        }

        setInterval(createHeart, 300);
    </script>

</body>
</html>
